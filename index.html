<style>

*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
header{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}

.logo-icon{width:30px;height:30px;background:var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}

.br.on{background:var(--rd);border-color:var(--rd);animation:pu 1.5s infinite}

.rd{width:8px;height:8px;background:#fff;border-radius:50%}.br.on .rd{animation:bl 1s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.vw{display:none;flex-direction:column;flex:1;overflow:hidden}.vw.on{display:flex}
.rc{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px;flex-shrink:0;border-bottom:1px solid var(--bd)}

.sd{width:7px;height:7px;border-radius:50%;background:var(--txd)}.sd.on{background:var(--gn);box-shadow:0 0 6px var(--gn)}.sd.er{background:var(--rd)}

.tc::-webkit-scrollbar{width:4px}.tc::-webkit-scrollbar-track{background:transparent}.tc::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--txd);gap:10px;text-align:center;padding:20px}
.es .ic{font-size:40px;opacity:.4}.es p{font-size:13px;max-width:280px;line-height:1.6}
.en{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);animation:fi .3s ease}.en:last-child{border-bottom:none}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.et{font-size:11px;color:var(--ac);font-family:monospace;white-space:nowrap;padding-top:2px;min-width:50px;flex-shrink:0}

.sp-tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0;align-self:flex-start}
.sp-a{background:rgba(108,140,255,.15);color:var(--sp-a)}.sp-b{background:rgba(255,107,157,.15);color:var(--sp-b)}
.sp-c{background:rgba(81,207,102,.15);color:var(--sp-c)}.sp-d{background:rgba(255,169,77,.15);color:var(--sp-d)}
.en.speaker-a{border-left:3px solid var(--sp-a);padding-left:8px}
.en.speaker-b{border-left:3px solid var(--sp-b);padding-left:8px}
.en.speaker-c{border-left:3px solid var(--sp-c);padding-left:8px}

.sp-btn{font-size:12px;padding:5px 12px;border-radius:16px;font-weight:600;border:2px solid transparent;flex-shrink:0}
.sp-btn.active{border-color:currentColor}
.sp-btn-a{color:var(--sp-a);background:rgba(108,140,255,.1)}.sp-btn-a.active{background:rgba(108,140,255,.25)}
.sp-btn-b{color:var(--sp-b);background:rgba(255,107,157,.1)}.sp-btn-b.active{background:rgba(255,107,157,.25)}
.sp-btn-c{color:var(--sp-c);background:rgba(81,207,102,.1)}.sp-btn-c.active{background:rgba(81,207,102,.25)}
.sp-btn-d{color:var(--sp-d);background:rgba(255,169,77,.1)}.sp-btn-d.active{background:rgba(255,169,77,.25)}
.sp-btn-auto{color:var(--txd);background:var(--sf2)}.sp-btn-auto.active{color:var(--tx);background:var(--sf)}
.li{padding:10px 16px;background:var(--sf);border-top:1px solid var(--bd);font-size:13px;color:var(--txd);min-height:44px;display:none;align-items:center;gap:8px;flex-shrink:0}.li.on{display:flex}
.wv{display:flex;align-items:center;gap:2px;height:18px;flex-shrink:0}
.wv span{width:3px;background:var(--ac);border-radius:2px;animation:wv .8s ease-in-out infinite}
.wv span:nth-child(1){height:6px}.wv span:nth-child(2){height:12px;animation-delay:.1s}.wv span:nth-child(3){height:8px;animation-delay:.2s}.wv span:nth-child(4){height:14px;animation-delay:.3s}.wv span:nth-child(5){height:5px;animation-delay:.4s}
@keyframes wv{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.2)}}
.lt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--bd);background:var(--sf);flex-shrink:0;gap:10px}
.ss{display:flex;gap:14px;font-size:11px;color:var(--txd)}.ss span strong{color:var(--tx);font-size:13px;margin-right:2px}
.hh{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}.hh h2{font-size:16px;font-weight:600}
.hl{flex:1;overflow-y:auto;padding:8px 16px}
.hi{padding:14px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px;cursor:pointer}.hi:hover{border-color:var(--ac)}
.ht{font-size:14px;font-weight:600;margin-bottom:6px}
.hm{font-size:11px;color:var(--txd);display:flex;gap:12px;flex-wrap:wrap}
.ha{display:flex;gap:6px;margin-top:8px}.ha button{font-size:11px;padding:4px 8px}
.he{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--txd);gap:10px;text-align:center;padding:40px 20px}
.dh{padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}.dh h2{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.de{flex:1;overflow-y:auto;padding:12px 16px}
.to{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:8px 16px;border-radius:8px;font-size:12px;opacity:0;transition:all .3s;z-index:100}.to.on{transform:translateX(-50%) translateY(0);opacity:1}
.us{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:24px;gap:16px}.us h2{color:var(--rd)}.us p{color:var(--txd);max-width:320px;line-height:1.6;font-size:13px}
.ld{display:flex;align-items:center;justify-content:center;padding:20px;color:var(--txd);font-size:13px}
@media(max-width:480px){.et{min-width:44px;font-size:10px}.ss{gap:10px}.ss span{font-size:10px}.ss span strong{font-size:12px}}
</style>

<body>
<div class="us" id="us"><div style="font-size:40px">&#x1F6AB;</div><h2>ブラウザが非対応です</h2><p>Web Speech APIが必要です。Chrome、Edge、Safariの最新版をお使いください。</p></div>
<div id="app">
<header><div class="logo"><div class="logo-icon">&#x1F399;</div><span>Voice Transcriber</span></div><div class="hb"><button class="bi" onclick="sv('record')">&#x1F3A4;</button><button class="bi" onclick="sv('history');lh()">&#x1F4DA;</button></div></header>
<div class="vw on" id="vwRecord">
<div class="rc"><div class="rl"><select id="ls"><option value="ja-JP">日本語</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select><div class="st"><div class="sd" id="sd"></div><span id="stx">待機中</span></div></div><div class="ab"><button onclick="ca()">&#x1F4CB;</button><button onclick="sa()">&#x1F4BE;</button><button onclick="cl()">&#x1F5D1;</button></div></div>
<div class="speaker-bar" id="speakerBar">
<span>話者:</span>
<button class="sp-btn sp-btn-auto active" onclick="setSpeakerMode('auto')">自動</button>
<button class="sp-btn sp-btn-a" onclick="setSpeakerMode('A')">A</button>
<button class="sp-btn sp-btn-b" onclick="setSpeakerMode('B')">B</button>
<button class="sp-btn sp-btn-c" onclick="setSpeakerMode('C')">C</button>
<button class="sp-btn sp-btn-d" onclick="setSpeakerMode('D')">D</button>
</div>
<div class="tc" id="tc"><div class="es" id="es"><div class="ic">&#x1F3A4;</div><p>下の録音ボタンをタップして話してください。自動で話者を識別し色分けします。うまくいかない場合はA〜Dボタンで手動切替も可能です。</p></div></div>
<div class="li" id="li"><div class="wv"><span></span><span></span><span></span><span></span><span></span></div><div class="lt" id="lt">認識中...</div></div>
<div class="bb"><div class="ss"><span><strong id="ec">0</strong>発話</span><span><strong id="cc">0</strong>文字</span><span><strong id="el">00:00</strong></span></div><button class="br" id="br" onclick="tr()"><div class="rd"></div><span>録音</span></button></div>
</div>
<div class="vw" id="vwHistory"><div class="hh"><h2>履歴</h2><button onclick="sv('record')">&larr; 戻る</button></div><div class="hl" id="hl"><div class="ld">読み込み中...</div></div></div>
<div class="vw" id="vwDetail"><div class="dh"><button onclick="sv('history');lh()">&larr; 戻る</button><h2 id="dt">セッション詳細</h2><button onclick="cd()">&#x1F4CB;</button></div><div class="de" id="de"></div></div>
</div>

<script>
var SU='https://jebqwqwnguvddqjfscmi.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplYnF3cXduZ3V2ZGRxamZzY21pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzA1MjcsImV4cCI6MjA5MjUwNjUyN30.uE1BFoOA43MUzlLWeUfNn7pYgeHcloruT8QPT2kqeOE';
var sb=supabase.createClient(SU,SK);var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){document.getElementById('app').style.display='none';document.getElementById('us').style.display='flex';}
var rec=null,on=false,ents=[],st=null,ti=null,cdd=null,hc=[];
var audioCtx=null,analyser=null,micStream=null;
var speakerMode='auto';
var speakerProfiles=[],currentSpeaker='A',lastPitch=0,silenceStart=0;
var SPEAKER_NAMES=['A','B','C','D'];
var SPEAKER_COLORS={A:'sp-a',B:'sp-b',C:'sp-c',D:'sp-d'};

function g(i){return document.getElementById(i)}
var br=g('br'),ls=g('ls'),sd=g('sd'),stx=g('stx'),tc=g('tc'),es=g('es'),li=g('li'),lt=g('lt'),ec=g('ec'),cc=g('cc'),el=g('el');

function setSpeakerMode(mode){
  speakerMode=mode;
  document.querySelectorAll('.sp-btn').forEach(function(b){b.classList.remove('active')});
  if(mode==='auto'){document.querySelector('.sp-btn-auto').classList.add('active');}
  else{document.querySelector('.sp-btn-'+mode.toLowerCase()).classList.add('active');currentSpeaker=mode;}
}

function sv(n){document.querySelectorAll('.vw').forEach(function(v){v.classList.remove('on')});g('vw'+n.charAt(0).toUpperCase()+n.slice(1)).classList.add('on');}

function startAudioAnalysis(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    micStream=stream;audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    var source=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=2048;
    source.connect(analyser);
    detectPitch();
  }).catch(function(e){console.log('Audio analysis unavailable:',e);});
}

function stopAudioAnalysis(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null;}
  if(audioCtx){audioCtx.close();audioCtx=null;}analyser=null;
}

function detectPitch(){
  if(!analyser||!on)return;
  var buf=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  var pitch=autoCorrelate(buf,audioCtx.sampleRate);
  if(pitch>0){lastPitch=pitch;silenceStart=0;}
  else{if(silenceStart===0)silenceStart=Date.now();}
  requestAnimationFrame(detectPitch);
}

function autoCorrelate(buf,sampleRate){
  var size=buf.length,rms=0;
  for(var i=0;i<size;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/size);
  if(rms<0.01)return -1;
  var r1=0,r2=size-1,thres=0.2;
  for(var i=0;i<size/2;i++){if(Math.abs(buf[i])<thres){r1=i;break;}}
  for(var i=1;i<size/2;i++){if(Math.abs(buf[size-i])<thres){r2=size-i;break;}}
  buf=buf.slice(r1,r2);size=buf.length;
  var c=new Array(size).fill(0);
  for(var i=0;i<size;i++)for(var j=0;j<size-i;j++)c[i]+=buf[j]*buf[j+i];
  var d=0;while(c[d]>c[d+1])d++;
  var maxVal=-1,maxPos=-1;
  for(var i=d;i<size;i++){if(c[i]>maxVal){maxVal=c[i];maxPos=i;}}
  var T0=maxPos;
  if(T0<2||T0>size-2)return -1;
  var x1=c[T0-1],x2=c[T0],x3=c[T0+1];
  var a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
  if(a)T0=T0-b/(2*a);
  return sampleRate/T0;
}

function identifySpeaker(pitch){
  if(speakerMode!=='auto')return currentSpeaker;
  if(pitch<=0)return currentSpeaker;
  var hadSilence=(silenceStart>0&&(Date.now()-silenceStart)>500);
  if(speakerProfiles.length===0){speakerProfiles.push({name:'A',pitchSum:pitch,count:1});currentSpeaker='A';return 'A';}
  var bestMatch=null,bestDist=Infinity;
  for(var i=0;i<speakerProfiles.length;i++){
    var avg=speakerProfiles[i].pitchSum/speakerProfiles[i].count;
    var dist=Math.abs(pitch-avg);
    if(dist<bestDist){bestDist=dist;bestMatch=i;}
  }
  var avgPitch=speakerProfiles[bestMatch].pitchSum/speakerProfiles[bestMatch].count;
  var threshold=avgPitch*0.15;
  if(bestDist<threshold){
    speakerProfiles[bestMatch].pitchSum+=pitch;speakerProfiles[bestMatch].count++;
    currentSpeaker=speakerProfiles[bestMatch].name;
  } else if(hadSilence&&speakerProfiles.length<4){
    var newName=SPEAKER_NAMES[speakerProfiles.length];
    speakerProfiles.push({name:newName,pitchSum:pitch,count:1});
    currentSpeaker=newName;
  } else {
    speakerProfiles[bestMatch].pitchSum+=pitch;speakerProfiles[bestMatch].count++;
    currentSpeaker=speakerProfiles[bestMatch].name;
  }
  return currentSpeaker;
}

function cr(){var r=new SR();r.continuous=true;r.interimResults=true;r.lang=ls.value;r.maxAlternatives=1;
r.onstart=function(){on=true;br.classList.add('on');br.querySelector('span').textContent='停止';sd.classList.add('on');sd.classList.remove('er');stx.textContent='認識中';li.classList.add('on');if(!st){st=Date.now();ti=setInterval(ut,1000);}};
r.onend=function(){if(on){try{rec.lang=ls.value;rec.start();}catch(e){sp();}}else{li.classList.remove('on');lt.textContent='';}};
r.onerror=function(e){if(e.error==='no-speech'){stx.textContent='音声なし...';return;}if(e.error==='aborted')return;sd.classList.add('er');sd.classList.remove('on');if(e.error==='not-allowed'){stx.textContent='マイク拒否';sp();}else{stx.textContent='Error: '+e.error;}};
r.onresult=function(ev){var im='',fn='';for(var i=ev.resultIndex;i<ev.results.length;i++){var t=ev.results[i][0].transcript;if(ev.results[i].isFinal)fn+=t;else im+=t;}if(im){lt.textContent=im;stx.textContent='認識中';}if(fn.trim()){var speaker=identifySpeaker(lastPitch);ae(fn.trim(),speaker);lt.textContent='';}};
return r;}

function tr(){on?sp():sr();}
function sr(){rec=cr();try{rec.start();startAudioAnalysis();}catch(e){tw('マイクの起動に失敗');}}
function sp(){on=false;if(rec){rec.stop();rec=null;}br.classList.remove('on');br.querySelector('span').textContent='録音';sd.classList.remove('on');stx.textContent='停止';li.classList.remove('on');clearInterval(ti);ti=null;stopAudioAnalysis();if(ents.length>0)ss();}

function ae(text,speaker){
  speaker=speaker||currentSpeaker;
  var now=new Date();var ts=now.toTimeString().slice(0,8);var lang=ls.value.startsWith('ja')?'JA':'EN';
  ents.push({time:ts,text:text,lang:lang,ts:now.toISOString(),speaker:speaker});
  if(es)es.style.display='none';
  var d=document.createElement('div');
  d.className='en speaker-'+speaker.toLowerCase();
  d.innerHTML='<div class="et">'+ts+'</div><span class="sp-tag sp-'+speaker.toLowerCase()+'">'+speaker+'</span><div class="ex">'+esc(text)+'</div>';
  tc.appendChild(d);tc.scrollTop=tc.scrollHeight;us();
}

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function us(){ec.textContent=ents.length;cc.textContent=ents.reduce(function(s,e){return s+e.text.length;},0);}
function ut(){if(!st)return;var d=Math.floor((Date.now()-st)/1000);el.textContent=String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0');}

function ss(){if(ents.length===0)return;var dur=st?Math.floor((Date.now()-st)/1000):0;var now=new Date();var title=now.toLocaleDateString('ja-JP')+' '+now.toTimeString().slice(0,5)+' のセッション';sb.from('transcriptions').insert({title:title,language:ls.value,entries:ents,total_chars:ents.reduce(function(s,e){return s+e.text.length;},0),total_entries:ents.length,duration_seconds:dur}).then(function(r){if(r.error)tw('保存に失敗');else tw('履歴に保存しました');});}

function dh(id){if(!confirm('削除しますか？'))return;sb.from('transcriptions').delete().eq('id',id).then(function(r){if(r.error){tw('削除に失敗');return;}tw('削除しました');lh();});}
